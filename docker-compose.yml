services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vnodex
      POSTGRES_USER: vnodex
      POSTGRES_PASSWORD: vnodex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnodex -d vnodex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vnodex-node:
    build:
      context: .
      dockerfile: services/node/Dockerfile
    environment:
      VNODEX_NODE_ID: node-0001
      VNODEX_LISTEN_ADDR: 0.0.0.0:8080
      VNODEX_DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - nodexdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  vnodex-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      VNODEX_LISTEN_ADDR: 0.0.0.0:8090
      VNODEX_DATA_DIR: /data
    ports:
      - "8090:8090"
    volumes:
      - nodexdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  nodexdata: